<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Mario Kart DS Web</title>
		<link rel="icon" href="data:;base64,iVBORw0KGgo=" />
		<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
		<script>
			window.mobile = /android|iphone|ipad|ipod|mobile|iemobile|blackberry|opera mini/i.test(navigator.userAgent);
		</script>
		<script src="bundle.js"></script>
		<script>
			// Engine boot + render loop. Menus and game flow live in src/game/frontend.ts.
			const requestAnimationFrameFnct = getRequestAnimationFrameFnct(window);

			var mainScene = null;
			var gamePaused = false;
			var canvas3D = null;
			var keysArray = new Array(255); // legacy engine input, still read by controlRaceCPU
			var touches = [];
			var mobile = window.mobile;
			var osc, buf, vert;

			window.onload = function () {
				window.simpleMatStack = { dat: mat4.create(), built: true };
				canvas3D = document.getElementById("canvas3d");
				document.addEventListener("keydown", (e) => (keysArray[e.keyCode] = true));
				document.addEventListener("keyup", (e) => (keysArray[e.keyCode] = false));
				Frontend.init();
			};

			window.onerror = function (msg, url, line, col, e) {
				console.error(e ? e.stack : msg);
			};

			/** Called by the frontend once the ROM is available. Returns the shared IngameRes. */
			function initNitro(rom) {
				refreshSettings();
				gl = initGL(canvas3D);
				gameROM = new ndsFS(rom);

				nitroRender.init(gl);
				shadowRender.init(gl);
				sceneDrawer.getInstance().init(gl);

				nitroAudio.init(new sdat(gameROM.getFile("/data/Sound/sound_data.sdat")));
				// Unlock audio on browsers that need a played buffer inside a user gesture.
				var ctx = nitroAudio.ctx;
				buf = ctx.createBuffer(1, 1, 44000);
				osc = ctx.createBufferSource();
				osc.buffer = buf;
				osc.connect(ctx.destination);
				osc.start(0);
				osc.donezo = true;

				vert = 0;
				var res = new IngameRes(gameROM);
				startRenderLoop();
				return res;
			}

			function startRenderLoop() {
				startGameLoop(requestAnimationFrameFnct, {
					onUpdate: function () {
						if (mainScene && !gamePaused) mainScene.update();
					},
					onRender: function () {
						resizeCanvas();
						gl.viewport(0, 0, gl.viewportWidth, gl.viewportHeight);
						gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
						if (mainScene) mainScene.render();
					},
				});
			}

			function initGL(canvas) {
				var gl = canvas.getContext("webgl", { premultipliedAlpha: false, stencil: true, antialias: true });
				if (!gl) {
					alert("WebGL could not be initialized.");
					return null;
				}
				gl.clearColor(0.46, 0.47, 0.36, 1);
				gl.clear(gl.COLOR_BUFFER_BIT);
				gl.enable(gl.DEPTH_TEST);
				gl.viewportWidth = canvas.width;
				gl.viewportHeight = canvas.height;
				return gl;
			}

			function resizeCanvas() {
				const fit = fitCanvasToWindow(window.innerWidth, window.innerHeight);
				if (canvas3D.width !== fit.width || canvas3D.height !== fit.height) {
					canvas3D.width = fit.width;
					canvas3D.height = fit.height;
				}
				gl.viewportWidth = fit.width;
				gl.viewportHeight = fit.height;
			}
		</script>
		<style>
			:root {
				--red: #e8322b;
				--yellow: #ffcc1a;
				--blue: #2f7bf5;
				--panel: rgba(12, 14, 28, 0.78);
				--panel-border: rgba(255, 255, 255, 0.14);
				--text: #fff;
				--muted: rgba(255, 255, 255, 0.65);
				--accent: var(--yellow);
				--display: "Lilita One", "Arial Black", system-ui, sans-serif;
				--body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				position: fixed;
				inset: 0;
				overflow: hidden;
				background: #000;
				color: var(--text);
				font-family: var(--body);
			}
			#canvas3d {
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
				display: block;
			}

			/* ---------- menu root ---------- */
			.ui-root {
				position: fixed;
				inset: 0;
				z-index: 10;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px 16px;
				overflow-y: auto;
			}
			.ui-root[hidden] {
				display: none;
			}
			.screen-menu,
			.screen-results,
			.screen-pause {
				background: radial-gradient(ellipse at center, rgba(5, 8, 25, 0.35), rgba(0, 0, 0, 0.7));
				backdrop-filter: blur(3px);
			}
			.ui-root.screen-boot {
				background:
					repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.025) 0 22px, transparent 22px 44px),
					radial-gradient(ellipse at 50% 30%, #2a1650, #0b0618 70%);
			}

			.panel {
				background: var(--panel);
				border: 1px solid var(--panel-border);
				border-radius: 22px;
				padding: 28px;
				width: min(520px, 100%);
				display: flex;
				flex-direction: column;
				gap: 14px;
				box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
				animation: pop 0.22s ease-out;
				backdrop-filter: blur(10px);
			}
			.panel.wide {
				width: min(1040px, 100%);
			}
			@keyframes pop {
				from {
					transform: translateY(12px) scale(0.98);
					opacity: 0;
				}
			}
			h2.screen-title {
				margin: 0 0 6px;
				font-family: var(--display);
				font-weight: 400;
				font-size: clamp(26px, 3.4vw, 40px);
				letter-spacing: 0.5px;
				display: flex;
				align-items: center;
				gap: 12px;
				flex-wrap: wrap;
				text-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
			}
			.step {
				display: block;
				width: 100%;
				font-family: var(--body);
				font-weight: 900;
				font-size: 12px;
				letter-spacing: 3px;
				text-transform: uppercase;
				color: var(--accent);
			}
			.title-portrait {
				height: 1.3em;
				image-rendering: pixelated;
			}

			/* ---------- logo / title ---------- */
			.title-screen {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 22px;
				text-align: center;
			}
			.logo {
				display: flex;
				flex-direction: column;
				align-items: center;
				line-height: 0.9;
				transform: rotate(-4deg);
			}
			.logo-top {
				font-family: var(--display);
				font-size: clamp(48px, 9vw, 110px);
				color: var(--red);
				-webkit-text-stroke: 3px #fff;
				paint-order: stroke fill;
				text-shadow: 0 8px 0 #7a0c09, 0 14px 30px rgba(0, 0, 0, 0.5);
			}
			.logo-ds {
				font-family: var(--display);
				font-size: clamp(56px, 11vw, 130px);
				color: var(--yellow);
				-webkit-text-stroke: 3px #fff;
				paint-order: stroke fill;
				text-shadow: 0 8px 0 #8a5d00;
			}
			.logo-web {
				margin-top: 10px;
				font-weight: 900;
				letter-spacing: 8px;
				font-size: 14px;
				color: #fff;
				background: var(--blue);
				padding: 6px 14px;
				border-radius: 999px;
			}
			.logo.small {
				flex-direction: row;
				gap: 10px;
				align-self: center;
				margin-bottom: 6px;
			}
			.logo.small .logo-top,
			.logo.small .logo-ds {
				font-size: 44px;
				text-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
			}
			.title-status {
				margin: 0;
				color: var(--muted);
				font-weight: 800;
			}
			.fineprint {
				color: var(--muted);
				font-size: 13px;
				max-width: 460px;
				margin: 0;
			}
			code,
			kbd {
				font-family: ui-monospace, monospace;
				background: rgba(255, 255, 255, 0.12);
				border-radius: 6px;
				padding: 1px 6px;
				font-size: 0.9em;
			}
			kbd {
				border-bottom: 2px solid rgba(255, 255, 255, 0.3);
				margin-right: 2px;
			}
			.spinner {
				width: 56px;
				height: 56px;
				border-radius: 50%;
				border: 6px solid rgba(255, 255, 255, 0.15);
				border-top-color: var(--yellow);
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			/* ---------- buttons ---------- */
			button {
				font-family: inherit;
				color: inherit;
				cursor: pointer;
			}
			button:disabled {
				cursor: default;
				opacity: 0.45;
			}
			.btn {
				border: 1px solid var(--panel-border);
				background: rgba(255, 255, 255, 0.08);
				border-radius: 12px;
				padding: 12px 20px;
				font-weight: 900;
				font-size: 16px;
				transition:
					transform 0.1s,
					background 0.15s;
			}
			.btn-primary {
				background: linear-gradient(180deg, #ff4a3d, #c81d16);
				border-color: rgba(255, 255, 255, 0.35);
				box-shadow: 0 4px 0 #6d0b07;
			}
			.btn-big {
				font-size: 22px;
				padding: 16px 48px;
				border-radius: 16px;
			}
			[data-nav]:focus-visible,
			[data-nav]:focus {
				outline: 3px solid var(--yellow);
				outline-offset: 3px;
			}
			[data-nav]:not(:disabled):hover,
			[data-nav]:focus {
				transform: translateY(-2px);
			}
			.menu-row {
				display: flex;
				gap: 10px;
				justify-content: center;
				flex-wrap: wrap;
				margin-top: 8px;
			}
			.toggle.on {
				background: var(--yellow);
				color: #222;
			}

			/* ---------- main menu ---------- */
			.main-menu {
				width: min(560px, 100%);
			}
			.menu-tile {
				display: grid;
				grid-template-columns: 56px 1fr;
				grid-template-rows: auto auto;
				align-items: center;
				text-align: left;
				border: none;
				border-radius: 16px;
				padding: 14px 18px;
				column-gap: 14px;
				box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25);
				transition: transform 0.1s;
			}
			.tile-icon {
				grid-row: span 2;
				font-size: 36px;
				text-align: center;
			}
			.tile-name {
				font-family: var(--display);
				font-size: 26px;
				letter-spacing: 0.5px;
			}
			.tile-desc {
				font-weight: 800;
				opacity: 0.85;
				font-size: 14px;
			}
			.tile-gp {
				background: linear-gradient(110deg, #e8322b, #ff7a1a);
			}
			.tile-vs {
				background: linear-gradient(110deg, #2f7bf5, #22b8e8);
			}
			.tile-tt {
				background: linear-gradient(110deg, #2cab4f, #8bd13a);
			}
			.tile-mp {
				background: linear-gradient(110deg, #6b5bd6, #a35bd6);
			}

			/* ---------- character select ---------- */
			.char-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
				gap: 12px;
			}
			.char-card {
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 4px;
				padding: 14px 8px 12px;
				border-radius: 16px;
				border: 2px solid transparent;
				background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 45%, #111), #15172a 80%);
				transition: transform 0.1s;
			}
			.char-card img {
				width: 72px;
				height: 72px;
				object-fit: contain;
				image-rendering: pixelated;
				filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.5));
			}
			.char-card.selected {
				border-color: var(--accent);
			}
			.char-name {
				font-family: var(--display);
				font-size: 18px;
			}
			.char-weight {
				font-size: 11px;
				font-weight: 900;
				letter-spacing: 2px;
				text-transform: uppercase;
				color: var(--muted);
			}

			/* ---------- kart select ---------- */
			.kart-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
				gap: 14px;
			}
			.kart-card {
				display: flex;
				flex-direction: column;
				gap: 8px;
				text-align: left;
				padding: 18px;
				border-radius: 16px;
				border: 2px solid var(--panel-border);
				background: rgba(255, 255, 255, 0.05);
			}
			.kart-card.selected {
				border-color: var(--accent);
			}
			.kart-name {
				font-family: var(--display);
				font-size: 24px;
				margin-bottom: 4px;
			}
			.stat {
				display: grid;
				grid-template-columns: 96px 1fr;
				align-items: center;
				gap: 8px;
				font-size: 13px;
				font-weight: 800;
				color: var(--muted);
			}
			.bar {
				height: 10px;
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.1);
				overflow: hidden;
			}
			.bar > div {
				height: 100%;
				border-radius: inherit;
				background: linear-gradient(90deg, var(--yellow), var(--red));
			}

			/* ---------- cups / courses ---------- */
			.cup-section-label {
				font-weight: 900;
				letter-spacing: 3px;
				font-size: 12px;
				text-transform: uppercase;
				color: var(--muted);
			}
			.cup-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 12px;
			}
			.cup-card {
				display: flex;
				flex-direction: column;
				gap: 6px;
				text-align: left;
				border: none;
				border-radius: 16px;
				padding: 16px;
				background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 70%, #000), color-mix(in srgb, var(--accent) 25%, #0d0f1f));
				box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25);
			}
			.cup-card.retro {
				background:
					repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 0 10px, transparent 10px 20px),
					linear-gradient(160deg, color-mix(in srgb, var(--accent) 60%, #000), color-mix(in srgb, var(--accent) 20%, #0d0f1f));
			}
			.cup-icon {
				font-size: 34px;
			}
			.cup-name {
				font-family: var(--display);
				font-size: 22px;
			}
			.cup-courses {
				font-size: 13px;
				font-weight: 800;
				opacity: 0.85;
				line-height: 1.45;
			}
			.course-list {
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			.course-card {
				display: flex;
				align-items: center;
				gap: 14px;
				padding: 14px 18px;
				border-radius: 14px;
				border: 1px solid var(--panel-border);
				background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 40%, transparent), rgba(255, 255, 255, 0.04));
				text-align: left;
			}
			.course-num {
				font-family: var(--display);
				font-size: 26px;
				width: 32px;
				color: var(--accent);
			}
			.course-name {
				font-family: var(--display);
				font-size: 22px;
			}
			.option-row {
				display: flex;
				align-items: center;
				gap: 10px;
				font-weight: 900;
			}
			.option-row > span {
				flex: 1;
			}

			/* ---------- controls table ---------- */
			table.controls {
				border-collapse: collapse;
				font-size: 14px;
				width: 100%;
			}
			table.controls th {
				text-align: left;
				color: var(--muted);
				font-size: 12px;
				letter-spacing: 2px;
				text-transform: uppercase;
				padding: 6px 4px;
			}
			table.controls td {
				padding: 7px 4px;
				border-top: 1px solid rgba(255, 255, 255, 0.08);
				font-weight: 800;
			}

			/* ---------- race intro ---------- */
			.screen-intro {
				background: linear-gradient(180deg, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.35));
			}
			.race-intro {
				text-align: center;
				animation: slidein 0.4s ease-out;
			}
			.kicker {
				font-weight: 900;
				letter-spacing: 4px;
				text-transform: uppercase;
				color: var(--yellow);
			}
			.intro-title {
				font-family: var(--display);
				font-size: clamp(40px, 7vw, 84px);
				text-shadow: 0 6px 0 rgba(0, 0, 0, 0.45);
			}
			@keyframes slidein {
				from {
					transform: translateX(-60px);
					opacity: 0;
				}
			}

			/* ---------- race HUD (top-right) ---------- */
			#race-hud {
				position: fixed;
				top: 16px;
				right: 16px;
				z-index: 5;
				pointer-events: none;
			}
			#race-hud[hidden] {
				display: none;
			}
			.hud-card {
				min-width: 210px;
				width: 232px;
				padding: 12px 16px;
				border-radius: 16px;
				background: rgba(8, 10, 24, 0.62);
				border: 1px solid rgba(255, 255, 255, 0.16);
				backdrop-filter: blur(6px);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
			}
			.hud-label {
				font-size: 11px;
				font-weight: 900;
				letter-spacing: 2px;
				text-transform: uppercase;
				color: var(--yellow);
			}
			.hud-map {
				margin: 6px -4px 4px;
				display: flex;
				justify-content: center;
			}
			.minimap {
				display: block;
				filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
			}
			.hud-time {
				font-family: var(--display);
				font-size: 34px;
				font-variant-numeric: tabular-nums;
				letter-spacing: 1px;
			}
			.hud-laps > div,
			.hud-best {
				display: flex;
				justify-content: space-between;
				gap: 16px;
				font-weight: 800;
				font-size: 14px;
				font-variant-numeric: tabular-nums;
				color: var(--muted);
			}
			.hud-best {
				color: var(--yellow);
				margin-top: 4px;
			}
			.hud-laps.big > div {
				font-size: 18px;
			}

			/* ---------- results ---------- */
			.results-table {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.result-row {
				display: grid;
				grid-template-columns: 40px 44px 1fr auto auto;
				align-items: center;
				gap: 12px;
				padding: 6px 14px;
				border-radius: 12px;
				background: rgba(255, 255, 255, 0.05);
				font-weight: 800;
				animation: pop 0.25s ease-out backwards;
			}
			.result-row:nth-child(2) {
				animation-delay: 0.04s;
			}
			.result-row:nth-child(3) {
				animation-delay: 0.08s;
			}
			.result-row:nth-child(4) {
				animation-delay: 0.12s;
			}
			.result-row:nth-child(5) {
				animation-delay: 0.16s;
			}
			.result-row:nth-child(6) {
				animation-delay: 0.2s;
			}
			.result-row:nth-child(7) {
				animation-delay: 0.24s;
			}
			.result-row:nth-child(8) {
				animation-delay: 0.28s;
			}
			.result-row.me {
				background: linear-gradient(90deg, rgba(255, 204, 26, 0.35), rgba(255, 204, 26, 0.08));
				outline: 2px solid var(--yellow);
			}
			.result-row img {
				width: 40px;
				height: 40px;
				object-fit: contain;
				image-rendering: pixelated;
			}
			.result-row .place {
				font-family: var(--display);
				font-size: 26px;
				text-align: center;
			}
			.result-row .time {
				font-variant-numeric: tabular-nums;
				color: var(--muted);
			}
			.result-row .pts {
				color: var(--yellow);
				min-width: 48px;
				text-align: right;
			}
			.tt-time {
				font-family: var(--display);
				font-size: 64px;
				text-align: center;
				color: var(--yellow);
			}
			.pause {
				width: min(380px, 100%);
			}

			/* ---------- online ---------- */
			.field {
				display: flex;
				flex-direction: column;
				gap: 6px;
				font-weight: 900;
				font-size: 13px;
				letter-spacing: 1px;
				text-transform: uppercase;
				color: var(--muted);
			}
			.field input,
			.join-row input {
				font: inherit;
				font-size: 18px;
				font-weight: 800;
				text-transform: none;
				letter-spacing: 0;
				color: var(--text);
				background: rgba(255, 255, 255, 0.08);
				border: 1px solid var(--panel-border);
				border-radius: 12px;
				padding: 12px 14px;
				outline: none;
			}
			.field input:focus,
			.join-row input:focus {
				border-color: var(--yellow);
			}
			.join-row {
				display: flex;
				gap: 10px;
			}
			.join-row input {
				flex: 1;
				min-width: 0;
				font-family: var(--display);
				font-size: 24px;
				letter-spacing: 6px;
				text-transform: uppercase;
			}
			.room-code {
				font-family: var(--display);
				letter-spacing: 6px;
				color: var(--yellow);
				background: rgba(255, 204, 26, 0.12);
				border: 2px dashed rgba(255, 204, 26, 0.6);
				border-radius: 12px;
				padding: 0 12px;
				cursor: copy;
			}
			.lobby .result-row .time {
				font-size: 13px;
			}
			.lobby-value {
				flex: 0 !important;
				white-space: nowrap;
				color: var(--yellow);
			}
			.waiting {
				align-self: center;
				font-weight: 800;
				color: var(--muted);
				animation: blink 1.6s ease-in-out infinite;
			}
			@keyframes blink {
				50% {
					opacity: 0.45;
				}
			}
			.error {
				color: #ff6b5e;
				font-weight: 800;
			}

			@media (max-width: 600px) {
				.panel {
					padding: 18px;
				}
				.result-row {
					grid-template-columns: 30px 32px 1fr auto;
				}
				.result-row .time {
					display: none;
				}
			}
		</style>
	</head>

	<body>
		<canvas id="canvas3d"></canvas>
		<div id="race-hud" hidden></div>
		<div id="ui" class="ui-root" hidden></div>
		<input type="file" id="fileIn" style="display: none" accept=".nds,application/x-nintendo-ds-rom" />
	</body>
</html>
