<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>mkjs — Course / NKM viewer</title>
		<link rel="icon" href="data:;base64,iVBORw0KGgo=" />
		<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<script src="bundle.js"></script>
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background-color: #000;
				color: #ddd;
				font-family: monospace;
				font-size: 12px;
			}
			#layout {
				display: flex;
				height: 100vh;
			}
			#left {
				width: 360px;
				flex: 0 0 360px;
				display: flex;
				flex-direction: column;
				border-right: 1px solid #333;
				overflow: hidden;
			}
			#romBar {
				flex: 0 0 auto;
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px;
				padding: 6px;
				border-bottom: 1px solid #333;
			}
			#romBar button,
			#left select,
			#left button {
				background: #1d3a1d;
				color: #ddd;
				border: 1px solid #2e5d2e;
				font-family: monospace;
				font-size: 12px;
				padding: 4px 6px;
				cursor: pointer;
			}
			#romBar button:hover:not(:disabled),
			#left button:hover:not(:disabled) {
				background: #2e5d2e;
			}
			#romBar button:disabled,
			#left button:disabled {
				opacity: 0.45;
				cursor: default;
			}
			#romInfo {
				color: #888;
				margin-left: auto;
			}
			#courseBar {
				flex: 0 0 auto;
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 6px;
				border-bottom: 1px solid #333;
			}
			#courseSelect {
				flex: 1 1 auto;
				min-width: 0;
				background: #121212;
				color: #ddd;
				border: 1px solid #333;
				font-family: monospace;
				font-size: 12px;
				padding: 4px 6px;
			}
			#stagInfo {
				flex: 0 0 auto;
				padding: 6px;
				border-bottom: 1px solid #333;
				color: #9fdfcf;
				white-space: pre-wrap;
				max-height: 96px;
				overflow-y: auto;
			}
			#layers {
				flex: 0 0 auto;
				padding: 6px;
				border-bottom: 1px solid #333;
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 2px 8px;
				max-height: 160px;
				overflow-y: auto;
			}
			#layers label {
				display: flex;
				align-items: center;
				gap: 4px;
				cursor: pointer;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#layers input {
				flex: 0 0 auto;
			}
			#sections {
				flex: 1 1 auto;
				min-height: 80px;
				overflow-y: auto;
				border-bottom: 1px solid #333;
			}
			.secHead {
				padding: 4px 6px;
				background: #161616;
				color: #cf9fdf;
				cursor: pointer;
				border-top: 1px solid #2a2a2a;
				display: flex;
				justify-content: space-between;
			}
			.secHead:hover {
				background: #221a26;
			}
			.secEntry {
				padding: 1px 6px 1px 16px;
				color: #8fa;
				cursor: pointer;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.secEntry:hover {
				background: #1d3a1d;
			}
			.secEntry.sel {
				background: #2e5d2e;
				color: #fff;
			}
			#detail {
				flex: 0 0 auto;
				max-height: 34vh;
				overflow-y: auto;
				padding: 6px;
				white-space: pre-wrap;
				color: #d8d8a0;
				border-top: 1px solid #333;
			}
			#right {
				flex: 1 1 auto;
				position: relative;
			}
			#canvas3d {
				width: 100%;
				height: 100%;
				display: block;
				outline: none;
			}
			#hud {
				position: absolute;
				top: 8px;
				left: 8px;
				background: rgba(0, 0, 0, 0.55);
				border: 1px solid #333;
				padding: 6px 8px;
				pointer-events: none;
				max-width: 360px;
			}
			#help {
				position: absolute;
				bottom: 8px;
				left: 8px;
				background: rgba(0, 0, 0, 0.55);
				border: 1px solid #333;
				padding: 6px 8px;
				pointer-events: none;
				color: #999;
			}
			#status {
				position: absolute;
				bottom: 8px;
				right: 8px;
				background: rgba(0, 0, 0, 0.55);
				border: 1px solid #333;
				padding: 6px 8px;
				color: #9fdfcf;
				max-width: 50%;
			}
			a.top-link {
				color: #6fb8cf;
			}
		</style>
	</head>
	<body>
		<div id="layout">
			<div id="left">
				<div id="romBar">
					<button id="loadCachedRom" disabled>Load cached ROM</button>
					<button id="openRomFile">Open ROM file…</button>
					<span id="romInfo"></span>
				</div>
				<div id="courseBar">
					<select id="courseSelect" disabled>
						<option value="">(load a ROM first)</option>
					</select>
					<button id="reloadCourse" disabled>Reload</button>
				</div>
				<div id="stagInfo">No course loaded.</div>
				<div id="layers"></div>
				<div id="sections"></div>
				<div id="detail">Click an entry in a section list to see its raw fields here.</div>
			</div>
			<div id="right">
				<canvas id="canvas3d"></canvas>
				<div id="hud"></div>
				<div id="help">
					Drag (left mouse) to look · WASD move · Q/E or Space/Shift down/up · wheel = speed · click a list entry to focus &amp;
					inspect · <a class="top-link" href="debug.html">debug.html</a>
				</div>
				<div id="status">Load a ROM to begin.</div>
			</div>
		</div>

		<input type="file" id="fileIn" style="display: none" accept=".nds" />

		<script src="course-viewer.js"></script>
	</body>
</html>
